<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ event.name }} · gallery</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <script src="/static/js/embed-frame.js?v={{ version }}" defer></script>
  <style>body { background-image: none; min-height: 0; } body::after { display: none; } .embed { padding: 16px; }</style>
</head>
<body>
  <div class="embed">
    <div class="between mb-2">
      <span class="kicker">{{ event.name }} · {{ total }} project{{ "s" if total != 1 }}</span>
      <a class="small" href="{{ base_url }}/projects?event={{ event.id }}" target="_blank" rel="noopener">Full gallery &gt;&gt;&gt;</a>
    </div>
    <div class="grid grid--3">
      {% for p in items %}
      <article class="card project-card">
        <div class="project-card__media">
          {% if p.thumbnail %}<img src="{{ base_url }}/uploads/{{ p.thumbnail }}" alt="" loading="lazy">{% else %}<span class="project-card__placeholder" aria-hidden="true">{{ p.title|initials }}</span>{% endif %}
        </div>
        <div class="project-card__body">
          <span class="project-card__meta">{{ p.track_name or "No track" }}</span>
          <h3 class="project-card__title"><a href="{{ base_url }}/projects/{{ p.id }}" target="_blank" rel="noopener">{{ p.title }}</a></h3>
          {% if p.tagline %}<p class="project-card__tagline">{{ p.tagline }}</p>{% endif %}
        </div>
      </article>
      {% endfor %}
    </div>
    <p class="small muted mt-2 mb-0">Powered by <a href="{{ base_url }}" target="_blank" rel="noopener">Doggfather</a></p>
  </div>
</body>
</html>
